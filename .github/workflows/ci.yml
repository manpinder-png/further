name: ci
on:
  pull_request:
  push:
    branches: [main, 'feature/**']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
